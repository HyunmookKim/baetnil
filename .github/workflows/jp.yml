name: collect-jp
# 일본 정박지 자료 만들기 (STEP 8)
# ★ 자주 안 바뀌는 자료다. 달마다 한 번이면 넉넉하다 — Overpass 는 남의 서버라 아껴 쓴다.
on:
  schedule:
    - cron: '0 20 1 * *'   # 매달 1일 05:00 KST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  jp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # 자료 파일은 app/ 안에 둔다 (앱이 제 자리를 기준으로 찾는다)
      - run: node ../scripts/collect_jp.js
        working-directory: app
      - name: commit spots-jp.json
        run: |
          git config user.name "jp-bot"
          git config user.email "bot@users.noreply.github.com"
          git add app/spots-jp.json
          git diff --cached --quiet && exit 0
          git commit -m "일본 정박지 자료 다시 만들기"
          git pull --rebase origin main
          git push
