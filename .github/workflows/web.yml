name: build-web
# 공개 기록을 웹 페이지로 굽는다 (구글이 앱 안을 못 보기 때문이다)
#
# ★ 열쇠(secrets)를 안 쓴다 — boatPublic 은 규칙이 `allow read: if true` 라
#   웹 apiKey 하나로 읽는다. 비밀값은 하나 늘 때마다 샐 자리가 하나 는다.
on:
  schedule:
    - cron: '30 21 * * *'    # 매일 06:30 KST (kr 수집 30분 뒤 — 커밋이 안 부딪히게)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # 저장소 뿌리에 굽는다 — /m/, /v/, /r/, sitemap.xml, robots.txt
      # (앱은 app/ 안에 있으므로 서로 안 건드린다)
      - run: node scripts/build_web.js
        env:
          SITE_URL: https://baetnil.com
      - name: commit pages
        run: |
          git config user.name "web-bot"
          git config user.email "bot@users.noreply.github.com"
          git add m v r sitemap.xml robots.txt
          git diff --cached --quiet && exit 0
          git commit -m "공개 기록 웹 페이지 다시 굽기"
          git pull --rebase origin main
          git push
