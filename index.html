<style>
:root{
  --bg:#081521; --sf:#0E1D2B; --sf2:#132738;
  --ln:#1E3549; --tx:#E7EFF6; --tx2:#9FB4C6;
  --ac:#9CC6E8; --yel:#D9AE63; --grn:#5FB894; --red:#E4756A;
}
*{box-sizing:border-box; margin:0; padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--tx);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;
  line-height:1.7; font-size:17px;
  padding-bottom:env(safe-area-inset-bottom);
}
a{color:var(--ac); text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:900px; margin:0 auto; padding:0 20px}

/* 언어 */
.langbar{display:flex; justify-content:flex-end; gap:6px; padding:16px 0 0}
.langbar button{
  font:inherit; font-size:14px; font-weight:600;
  background:transparent; color:var(--tx2);
  border:1px solid var(--ln); border-radius:999px;
  padding:7px 15px; cursor:pointer; min-height:38px;
  transition:color .15s, border-color .15s, background .15s;
}
.langbar button:hover{color:var(--tx); border-color:var(--ac)}
.langbar button[aria-pressed="true"]{
  color:var(--bg); background:var(--ac); border-color:var(--ac);
}

header{padding:44px 0; text-align:center}
.logo{
  width:76px; height:76px; margin:0 auto 22px; border-radius:20px;
  background:linear-gradient(160deg,#16344E,#0C2033);
  border:1px solid var(--ln);
  display:flex; align-items:center; justify-content:center;
}
.logo svg{width:44px; height:44px}
h1{font-size:40px; font-weight:800; letter-spacing:-0.02em; margin-bottom:14px}
.tag{font-size:20px; color:var(--tx2); max-width:600px; margin:0 auto}
.tag b{color:var(--tx); font-weight:600}

.get{padding:0 0 52px}
.getgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:12px}
.btn{
  display:block; background:var(--sf); border:1px solid var(--ln); border-radius:14px;
  padding:18px 20px; text-align:left; color:var(--tx); text-decoration:none;
  transition:border-color .15s, background .15s;
}
.btn:hover{text-decoration:none}
.btn.on:hover{border-color:var(--ac); background:var(--sf2)}
.btn.off{opacity:.55}
.btn b{display:block; font-size:17px; font-weight:700; margin-bottom:3px}
.btn span{font-size:14px; color:var(--tx2)}
.btn.main{background:linear-gradient(160deg,#1B4568,#12314A); border-color:#2A5A80}

section{padding:52px 0; border-top:1px solid var(--ln)}
.eyebrow{font-size:14px; font-weight:700; letter-spacing:.04em; color:var(--ac); margin-bottom:8px}
.eyebrow.b{color:var(--yel)}
h2{font-size:27px; font-weight:750; margin-bottom:10px; letter-spacing:-0.01em}
.lead{color:var(--tx2); margin-bottom:28px; max-width:660px}
.lead b{color:var(--tx); font-weight:600}
.feat{display:grid; grid-template-columns:repeat(auto-fit,minmax(238px,1fr)); gap:14px}
.card{background:var(--sf); border:1px solid var(--ln); border-radius:14px; padding:20px}
.card h3{font-size:17px; font-weight:700; margin-bottom:6px; color:var(--tx)}
.card p{font-size:15px; color:var(--tx2); line-height:1.65}
.dot{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:8px; vertical-align:middle}

.note{
  background:rgba(217,174,99,.09); border:1px solid rgba(217,174,99,.3);
  border-radius:12px; padding:16px 18px; font-size:15px; color:var(--tx2);
}
.note b{color:var(--yel)}

.biz{background:var(--sf); border:1px solid var(--ln); border-radius:14px; padding:22px; font-size:15px}
.biz dl{display:grid; grid-template-columns:auto 1fr; gap:9px 18px}
.biz dt{color:var(--tx2); white-space:nowrap}
.biz dd{color:var(--tx)}

footer{padding:36px 0 56px; border-top:1px solid var(--ln); font-size:14px; color:var(--tx2)}
.links{display:flex; flex-wrap:wrap; gap:8px 22px; margin-bottom:18px}

@media (max-width:560px){
  header{padding:32px 0}
  h1{font-size:32px}
  .tag{font-size:18px}
  body{font-size:16px}
  h2{font-size:23px}
  .biz dl{grid-template-columns:1fr; gap:2px 0}
  .biz dt{margin-top:10px}
}
</style>
</head>

(function(){
  var KEY = 'bt_site_lang';
  function pick(){
    try{ var s = localStorage.getItem(KEY); if(s && I18N[s]) return s; }catch(_){}
    var n = (navigator.language || 'ko').slice(0,2).toLowerCase();
    return I18N[n] ? n : (n === 'uk' || n === 'be' || n === 'kk' ? 'ru' : 'ko');
  }
  function draw(lang){
    var d = I18N[lang] || I18N.ko;
    document.documentElement.lang = lang;
    document.title = d.title;
    var m = document.querySelector('meta[name="description"]');
    if(m) m.setAttribute('content', d.desc);
    var ogt = document.querySelector('meta[property="og:title"]');
    if(ogt) ogt.setAttribute('content', d.title);
    var els = document.querySelectorAll('[data-t]');
    for(var i=0;i<els.length;i++){
      var k = els[i].getAttribute('data-t');
      if(d[k] !== undefined) els[i].innerHTML = d[k];
    }
    // 약관 문서는 언어마다 파일이 따로 있다 (terms.html / terms.en.html / terms.ru.html)
    var docs = document.querySelectorAll('[data-doc]');
    for(var n=0;n<docs.length;n++){
      var name = docs[n].getAttribute('data-doc');
      docs[n].href = '/' + name + (lang === 'ko' ? '' : '.' + lang) + '.html';
    }
    var bs = document.querySelectorAll('.langbar button');
    for(var j=0;j<bs.length;j++){
      bs[j].setAttribute('aria-pressed', bs[j].getAttribute('data-lang') === lang ? 'true' : 'false');
    }
    try{ localStorage.setItem(KEY, lang); }catch(_){}
  }
  var bs = document.querySelectorAll('.langbar button');
  for(var i=0;i<bs.length;i++){
    bs[i].addEventListener('click', function(){ draw(this.getAttribute('data-lang')); });
  }
  draw(pick());
})();
</script>
